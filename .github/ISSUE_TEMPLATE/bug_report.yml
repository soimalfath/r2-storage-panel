name: Bug report
description: Report a problem with R2 Storage Panel
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: deployment
    attributes:
      label: Deployment
      description: Standalone Node or Vercel? Node version?
      placeholder: "Standalone Node, Node 22"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs or screenshots. Do NOT include secrets, tokens, or API keys.
      render: shell
    validations:
      required: false
